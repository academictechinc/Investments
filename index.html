<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>Portfolio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141a;--panel:#181b23;--panel2:#1e222c;--line:#2a2f3b;--grid:rgba(79,216,196,.045);
  --ink:#e7e9ef;--dim:#8b92a3;--faint:#5c6273;
  --teal:#4fd8c4;--amber:#f2a93b;--red:#ff7a70;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed;
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--teal)}.down{color:var(--red)}.warn{color:var(--amber)}.dim{color:var(--dim)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:rgba(18,20,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.01em}
.brand svg{width:22px;height:22px}
.status{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
.status .spin{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status .spin{animation:none}}

main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(18,20,26,.96);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
.tabs button{flex:1;background:none;border:0;padding:9px 2px 10px;color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabs button[aria-current="page"]{color:var(--teal)}

/* hero */
.hero{padding:10px 2px 18px}
.hero .lbl{color:var(--dim);font-size:13px}
.hero .big{font-size:clamp(38px,11vw,56px);font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.hero .big .cents{font-size:.45em;color:var(--dim);font-weight:500;margin-left:2px}
.hero .lines{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--mono);font-size:13px}
.hero .lines span b{font-weight:500}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-weight:400}
.flags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.flag{background:rgba(242,169,59,.1);border:1px solid rgba(242,169,59,.35);color:var(--amber);border-radius:999px;padding:5px 11px;font-size:13px}
button.flag{cursor:pointer}

/* chart */
.chart{--c:var(--teal)}
.chart.neg{--c:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 10px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--teal)}
.chart-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chart-ctl select{margin-left:auto}
.chart-read{font-family:var(--mono);font-size:13px;min-height:20px;margin-bottom:6px}
.plot{position:relative;height:170px;touch-action:pan-y}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plot .cursor{position:absolute;top:0;bottom:0;width:1px;background:var(--dim);opacity:0;pointer-events:none}
.plot .dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg);opacity:0;pointer-events:none}
.plot .ylab{position:absolute;right:0;font-family:var(--mono);font-size:11px;color:var(--faint);background:rgba(24,27,35,.7);padding:0 3px}
.plot .ylab.top{top:0}.plot .ylab.bot{bottom:0}
.xlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:6px}
.chart-empty{border:1px dashed var(--line);border-radius:10px;padding:26px 16px;color:var(--dim);font-size:14px;text-align:center}

/* lists */
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 2px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .t{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.row .t .nm{font-weight:400;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-family:var(--mono);font-size:14px}
.row .s{font-size:12px;color:var(--dim);font-family:var(--mono)}
.row .s2{text-align:right;font-size:12px;font-family:var(--mono)}
button.row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.amber i{background:var(--amber)}
.badge{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);font-weight:400}
.badge.amber{border-color:rgba(242,169,59,.45);color:var(--amber)}
.badge.teal{border-color:rgba(79,216,196,.4);color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--dim)}
.chip[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);background:rgba(79,216,196,.08)}
.detail{grid-column:1/-1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.detail .sub{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.detail .sub:first-child{border-top:0}
.detail .sub .s{grid-column:1/-1}
.detail .tagrow{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.detail .tagrow .lbl{font-size:12px;color:var(--dim);margin-bottom:6px}
.addtag{display:flex;gap:6px;margin-top:8px}
.addtag input{flex:1;min-width:0}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:140px}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],select{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
select{padding-right:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#0d1a18;font-weight:600}
.btn.amber{border-color:rgba(242,169,59,.5);color:var(--amber)}
.btn.danger{border-color:rgba(255,122,112,.5);color:var(--red)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:13px;color:var(--dim);margin:6px 0 0}
.acct-head{display:flex;align-items:baseline;gap:8px}
.acct-head .v{margin-left:auto;font-family:var(--mono)}
.acct-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.empty{text-align:center;padding:34px 14px;color:var(--dim)}
.empty h3{color:var(--ink);font-size:17px;margin:0 0 6px}
.empty .btn{margin-top:12px}

/* dialog */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:0;width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(5,6,9,.7)}
.dlg{padding:16px;overflow:auto;max-height:88vh}
.dlg h3{margin:0 0 12px;font-size:17px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label,.field .lbl{font-size:13px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px;position:sticky;bottom:-16px;background:var(--panel);padding:10px 0 2px}
.dlg-actions .left{margin-right:auto}
.map{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin-bottom:12px}
.map label{font-size:13px;color:var(--dim)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0 10px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:500}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim);margin-bottom:10px}
.hist{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.hist div{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px}
.hist div:last-child{border-bottom:0}
.hist button{background:none;border:0;color:var(--red);font-size:12px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);
  padding:10px 14px;border-radius:10px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4fd8c4" stroke-width="1.8" aria-hidden="true"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/><circle cx="19" cy="6" r="1.6" fill="#f2a93b" stroke="none"/></svg>
    Portfolio
  </div>
  <div class="status" id="status"></div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="overview"><svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>Overview</button>
  <button data-act="tab" data-tab="holdings"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Holdings</button>
  <button data-act="tab" data-tab="categories"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 5"/></svg>Categories</button>
  <button data-act="tab" data-tab="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Accounts</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div id="toast" role="status"></div>
<input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const money = (n, dec = 0) => (n == null || !isFinite(n)) ? '—' :
  n.toLocaleString('en-US', {style: 'currency', currency: 'USD', minimumFractionDigits: dec, maximumFractionDigits: dec});
const money2 = n => money(n, 2);
const signed = (n, dec = 0) => (n == null || !isFinite(n)) ? '—' : (n >= 0 ? '+' : '−') + money(Math.abs(n), dec);
const pct = n => (n == null || !isFinite(n)) ? '—' : (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(2) + '%';
const share = n => (n == null || !isFinite(n)) ? '—' : n.toFixed(1) + '%';
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : '';
const qtyFmt = n => n == null ? '—' : (+n).toLocaleString('en-US', {maximumFractionDigits: 4});
const fdate = (d, yr) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', yr ? {month: 'short', day: 'numeric', year: 'numeric'} : {month: 'short', day: 'numeric'});
function ago(ts) {
  if (!ts) return 'never';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 36) return h + ' hr ago';
  return Math.round(h / 24) + ' days ago';
}
function daysSince(d) { return Math.floor((Date.now() - new Date(d + 'T12:00:00')) / 86400000); }
let toastT;
function toast(msg, ms = 3200) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }

/* ---------- storage (IndexedDB) ---------- */
const idb = {
  db: null,
  open() { return new Promise((res, rej) => { const r = indexedDB.open('portfolio', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  get(k) { return new Promise((res, rej) => { if (!this.db) return res(undefined);
    const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v) { return new Promise((res, rej) => { if (!this.db) return res();
    const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};

/* ---------- state ---------- */
const DEFAULT_STATE = () => ({
  v: 1,
  accounts: [
    {id: uid(), name: 'Robinhood', type: 'brokerage', tags: []},
    {id: uid(), name: 'Charles Schwab', type: 'brokerage', tags: []},
    {id: uid(), name: 'Fidelity', type: 'brokerage', tags: []},
    {id: uid(), name: 'MACS 529', type: 'manual', tags: ['College']},
    {id: uid(), name: 'New York Life SIMPLE IRA', type: 'manual', tags: ['Retirement']}
  ],
  holdings: [],     // {id, accountId, symbol, name, qty, cost(total), csvPrice, csvValue, manualPrice}
  tags: {},         // SYMBOL -> [tag, ...]
  balances: {},     // accountId -> [{d, v}]
  settings: {key: '', maxAge: 15},
  pricesAt: 0
});
let S = DEFAULT_STATE(), P = {}, SNAP = [];
const U = {tab: 'overview', range: '3M', series: 'total', hview: 'combined', sort: 'value', q: '', open: {}, tag: null, needPrice: false};

async function save() { try { await idb.set('state', S); } catch (e) { toast('Save failed: ' + e.message); } }

// Money market / cash tickers priced at $1
const CASHY = /^(CASH|CORE|SPAXX|FDRXX|FZFXX|SPRXX|FCASH|SWVXX|SNVXX|SNSXX|SNOXX|SWGXX|VMFXX|VMRXX|QACDS)$/;

/* ---------- pricing & math ---------- */
function priceOf(h) {
  if (h.manualPrice > 0) return {p: h.manualPrice, src: 'manual'};
  if (CASHY.test(h.symbol)) return {p: 1, src: 'cash'};
  const q = P[h.symbol];
  if (q && q.c > 0) return {p: q.c, src: 'live', q};
  if (h.csvPrice > 0) return {p: h.csvPrice, src: 'import'};
  if (h.csvValue > 0 && h.qty > 0) return {p: h.csvValue / h.qty, src: 'import'};
  return {p: null, src: 'none'};
}
function latestBal(aid) { const b = S.balances[aid] || []; return b.length ? b[b.length - 1] : null; }
function prevBal(aid) { const b = S.balances[aid] || []; return b.length > 1 ? b[b.length - 2] : null; }
function tagsFor(sym) { const t = S.tags[sym]; return t && t.length ? t : []; }

function calc() {
  const rows = S.holdings.map(h => {
    const pi = priceOf(h);
    const value = pi.p != null ? h.qty * pi.p : null;
    const day = (pi.src === 'live' && pi.q.pc > 0) ? h.qty * (pi.q.c - pi.q.pc) : 0;
    const gain = (value != null && h.cost > 0) ? value - h.cost : null;
    return {...h, price: pi.p, src: pi.src, value, day, gain};
  });
  const acc = {};
  const blank = () => ({value: 0, day: 0, gain: 0, gcost: 0, n: 0, missing: 0, dayBase: 0});
  S.accounts.forEach(a => acc[a.id] = blank());
  rows.forEach(r => {
    const a = acc[r.accountId]; if (!a) return;
    a.n++; a.value += r.value || 0; a.day += r.day;
    if (r.src === 'live') a.dayBase += r.value - r.day;
    if (r.gain != null) { a.gain += r.gain; a.gcost += r.cost; }
    if (r.value == null) a.missing++;
  });
  S.accounts.forEach(a => {
    if (a.type === 'manual') {
      const L = latestBal(a.id), pv = prevBal(a.id);
      acc[a.id] = {...blank(), value: L ? L.v : 0, since: pv ? L.v - pv.v : null, asOf: L ? L.d : null};
    }
  });
  const tot = blank();
  for (const id in acc) { const a = acc[id]; tot.value += a.value; tot.day += a.day; tot.gain += a.gain; tot.gcost += a.gcost; tot.dayBase += a.dayBase; tot.missing += a.missing; }

  const tags = {};
  const T = name => tags[name] || (tags[name] = {value: 0, gain: 0, gcost: 0, day: 0, dayBase: 0, syms: new Set(), accts: new Set()});
  rows.forEach(r => {
    const a = S.accounts.find(x => x.id === r.accountId);
    if (!a || a.type === 'manual') return;
    const list = tagsFor(r.symbol);
    (list.length ? list : ['Untagged']).forEach(t => {
      const o = T(t); o.value += r.value || 0; o.day += r.day; o.syms.add(r.symbol);
      if (r.src === 'live') o.dayBase += r.value - r.day;
      if (r.gain != null) { o.gain += r.gain; o.gcost += r.cost; }
    });
  });
  S.accounts.filter(a => a.type === 'manual').forEach(a => {
    const list = a.tags && a.tags.length ? a.tags : ['Untagged'];
    list.forEach(t => { const o = T(t); o.value += acc[a.id].value; o.accts.add(a.name); });
  });
  return {rows, acc, tot, tags};
}

function consolidate(rows) {
  const g = {};
  rows.forEach(r => {
    const o = g[r.symbol] || (g[r.symbol] = {symbol: r.symbol, name: r.name, qty: 0, value: 0, cost: 0, gain: 0, hasGain: false, day: 0, dayBase: 0, rows: [], missing: false, srcs: new Set()});
    o.qty += r.qty; o.value += r.value || 0; o.day += r.day; o.rows.push(r); o.srcs.add(r.src);
    if (!o.name && r.name) o.name = r.name;
    if (r.src === 'live') o.dayBase += r.value - r.day;
    if (r.gain != null) { o.gain += r.gain; o.cost += r.cost; o.hasGain = true; }
    if (r.value == null) o.missing = true;
  });
  return Object.values(g);
}

/* ---------- live quotes (Finnhub) ---------- */
let refreshing = false, refreshMsg = '';
async function refresh(force) {
  if (refreshing) return;
  const key = (S.settings.key || '').trim();
  if (!key) { if (force) toast('Add a free Finnhub key in Settings to pull live prices.'); return; }
  const syms = [...new Set(S.holdings.filter(h => !(h.manualPrice > 0) && !CASHY.test(h.symbol)).map(h => h.symbol))];

/* ---------- daily snapshots ---------- */
async function snap() {
  const c = calc();
  if (!(c.tot.value > 0)) return;
  const s = {d: today(), total: c.tot.value, acc: {}, tags: {}};
  for (const id in c.acc) s.acc[id] = c.acc[id].value;
  for (const t in c.tags) s.tags[t] = c.tags[t].value;
  const i = SNAP.findIndex(x => x.d === s.d);
  if (i >= 0) SNAP[i] = s; else { SNAP.push(s); SNAP.sort((a, b) => a.d < b.d ? -1 : 1); }
  try { await idb.set('snaps', SNAP); } catch (e) {}
}

function readDefault() {
  if (!CH) return; const s = CH.series, a = s[0].v, b = s[s.length - 1].v, d = b - a;
  $('#chartRead').innerHTML = `<span class="${cls(d)}">${signed(d)} (${pct(a ? d / a * 100 : 0)})</span> <span class="dim">over ${U.range === 'All' ? 'all time' : U.range}</span>`;
}
function bindChart() {
  const plot = $('#plot'); if (!plot || !CH) return;
  readDefault();
  const cur = $('#ccur'), dot = $('#cdot');
  const move = e => {
    const r = plot.getBoundingClientRect(); const fx = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * CH.W;
    let i = 0, best = Infinity; CH.pts.forEach((p, j) => { const dd = Math.abs(p[0] - fx); if (dd < best) { best = dd; i = j; } });
    const p = CH.pts[i], s = CH.series[i], d = s.v - CH.series[0].v;
    cur.style.left = (p[0] / CH.W * 100) + '%'; cur.style.opacity = .6;
    dot.style.left = (p[0] / CH.W * 100) + '%'; dot.style.top = (p[1] / CH.H * 100) + '%'; dot.style.opacity = 1;
    $('#chartRead').innerHTML = `${fdate(s.d, true)} <b>${money(s.v)}</b> <span class="${cls(d)}">${signed(d)}</span>`;
  };
  plot.addEventListener('pointermove', move);
  plot.addEventListener('pointerdown', move);
  plot.addEventListener('pointerleave', () => { cur.style.opacity = 0; dot.style.opacity = 0; readDefault(); });
}

/* ---------- views ---------- */
function renderStatus() {
  const el = $('#status');
  if (refreshing) { el.innerHTML = `<span class="spin"></span>${esc(refreshMsg)}`; return; }

  el.innerHTML = S.settings.key ? `Prices ${ago(S.pricesAt)}` : '<span class="warn">No live prices</span>';
}
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === U.tab ? 'page' : 'false'));
  renderStatus();

  $('#view').innerHTML = v;

}

function srcBadge(src) {

function sortFn() {
  return {value: (a, b) => b.value - a.value,
    gain: (a, b) => ((b.hasGain ? b.gain / b.cost : -1e9) - (a.hasGain ? a.gain / a.cost : -1e9)),
    day: (a, b) => ((b.dayBase ? b.day / b.dayBase : -1e9) - (a.dayBase ? a.day / a.dayBase : -1e9)),
    az: (a, b) => a.symbol.localeCompare(b.symbol)}[U.sort];
}

/* ---------- actions ---------- */

  tab: el => { U.tab = el.dataset.tab; U.open = {}; render(); scrollTo(0, 0); },
  closeDlg, doImport,
  import: el => startImport(el.dataset.id),
  refresh: () => refresh(true),
  range: el => { U.range = el.dataset.r; render(); },
  hview: el => { U.hview = el.dataset.v; render(); },
  toggle: el => { const s = el.dataset.s; U.open[s] = !U.open[s]; render(); },
  needPrice: () => { U.needPrice = !U.needPrice; U.tab = 'holdings'; render(); },
  openAcct: () => { U.tab = 'holdings'; U.hview = 'accounts'; render(); },
  editHolding: el => holdingDlg(el.dataset.id),
  addHolding: el => holdingDlg(null, el.dataset.id),
  saveHolding: el => saveHolding(el.dataset.id),
  delHolding: async el => { if (!confirm('Remove this holding?')) return; S.holdings = S.holdings.filter(h => h.id !== el.dataset.id); await save(); await snap(); closeDlg(); render(); },
  addAccount: () => accountDlg(null), editAccount: el => accountDlg(el.dataset.id),
  saveAccount: el => saveAccount(el.dataset.id), delAccount: el => delAccount(el.dataset.id),
  bal: el => balanceDlg(el.dataset.id), saveBal: el => saveBal(el.dataset.id),
  delBal: async el => { const id = el.dataset.id; S.balances[id] = (S.balances[id] || []).filter(b => b.d !== el.dataset.d); await save(); await snap(); balanceDlg(id); render(); },
  tagToggle: async el => { const s = el.dataset.s, t = el.dataset.t; const cur = tagsFor(s).slice(); const i = cur.indexOf(t); i >= 0 ? cur.splice(i, 1) : cur.push(t); S.tags[s] = cur; await save(); await snap(); render(); },
  tagAdd: async el => { const s = el.dataset.s; const inp = document.getElementById('nt_' + s); const t = splitTags(inp.value); if (!t.length) return; S.tags[s] = [...new Set([...tagsFor(s), ...t])]; await save(); await snap(); render(); },
  pickTag: el => { U.tag = U.tag === el.dataset.t ? null : el.dataset.t; render(); },
  tagRename: async el => { const old = el.dataset.t; const nw = (prompt('Rename category', old) || '').trim(); if (!nw || nw === old) return;
    for (const s in S.tags) S.tags[s] = [...new Set(S.tags[s].map(x => x === old ? nw : x))];
    S.accounts.forEach(a => { if (a.tags) a.tags = [...new Set(a.tags.map(x => x === old ? nw : x))]; });
    SNAP.forEach(s => { if (s.tags[old] != null) { s.tags[nw] = (s.tags[nw] || 0) + s.tags[old]; delete s.tags[old]; } });
    U.tag = nw; await save(); await idb.set('snaps', SNAP); render(); },
  tagDelete: async el => { const t = el.dataset.t; if (!confirm(`Remove the ${t} category from every holding?`)) return;
    for (const s in S.tags) S.tags[s] = S.tags[s].filter(x => x !== t);
    S.accounts.forEach(a => { if (a.tags) a.tags = a.tags.filter(x => x !== t); });
    U.tag = null; await save(); await snap(); render(); },
  export: () => { const blob = new Blob([JSON.stringify({app: 'portfolio', v: 1, exported: new Date().toISOString(), state: S, snaps: SNAP}, null, 1)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `portfolio-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
  restore: () => { const f = $('#restoreFile'); f.value = ''; f.click(); },
  reset: async () => { if (!confirm('Erase all accounts, holdings, tags and history on this device?')) return; S = DEFAULT_STATE(); P = {}; SNAP = []; await save(); await idb.set('prices', P); await idb.set('snaps', SNAP); U.tab = 'overview'; render(); toast('Erased.'); }
};

$('#restoreFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (!j.state || !j.state.accounts) throw new Error('not a Portfolio backup');
    if (!confirm('Replace everything on this device with that backup?')) return;
    S = Object.assign(DEFAULT_STATE(), j.state); SNAP = j.snaps || []; await save(); await idb.set('snaps', SNAP); render(); toast('Backup restored.'); refresh(false);
  } catch (err) { toast('Could not restore: ' + err.message); }
});

/* ---------- boot ---------- */
(async function boot() {
  try { await idb.open(); } catch (e) { toast('Storage unavailable. Changes will not be saved.', 5000); }
  try {
    const st = await idb.get('state');
    if (st && st.accounts) S = Object.assign(DEFAULT_STATE(), st, {settings: Object.assign({key: '', maxAge: 15}, st.settings)});
    else await save();
    P = (await idb.get('prices')) || {}; SNAP = (await idb.get('snaps')) || [];
  } catch (e) {}
  render();
  const age = +S.settings.maxAge;
  if (S.settings.key && age > 0 && Date.now() - S.pricesAt > age * 60000) refresh(false);
  else snap();
  setInterval(renderStatus, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.settings.key && age > 0 && Date.now() - S.pricesAt > age * 60000) refresh(false); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
